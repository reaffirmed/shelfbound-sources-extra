<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelfbound Sources Extra</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f5f2; --fg: #1d1b19; --muted: #6e6a65; --card: #fff; --accent: #9e2a2b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161514; --fg: #f1eee9; --muted: #a29d96; --card: #22201e; --accent: #e0605f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.8rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a.button { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: .9rem; border-radius: .75rem; }
  code { display: block; margin-top: 1rem; padding: .75rem; background: var(--card); border-radius: .5rem; word-break: break-all; font-size: .9rem; }
  ul { list-style: none; padding: 0; margin: 2rem 0 0; }
  li { background: var(--card); border-radius: .75rem; padding: .75rem 1rem; margin-bottom: .5rem; }
  li span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Shelfbound Sources Extra</h1>
  <p>Open this page on the phone that has Shelfbound, then tap the button. Or paste the address below into Browse → Add repository.</p>
  <a class="button" id="add" href="shelfbound://add-repo?url=https%3A%2F%2Freaffirmed.github.io%2Fshelfbound-sources-extra%2F">Add to Shelfbound</a>
  <code id="url">https://reaffirmed.github.io/shelfbound-sources-extra/</code>
  <ul id="sources"></ul>
</main>
<script>
  fetch("index.json").then((r) => r.json()).then((index) => {
    const list = document.getElementById("sources");
    for (const s of index.sources) {
      const li = document.createElement("li");
      li.textContent = s.name + " ";
      const meta = document.createElement("span");
      meta.textContent = "v" + s.version + " · " + (s.format || s.kind) + " · " + s.contentRating;
      li.appendChild(meta);
      list.appendChild(li);
    }
  }).catch(() => {});
</script>
</body>
</html>
